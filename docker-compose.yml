services:
  php:
    build: ./
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - keycloak
      - mailpit
    env_file:
      - .env
      # `.env` entra como variables de entorno REALES del contenedor, y Symfony
      # no las sobrescribe con `.env.local`. Sin esta línea, cualquier clave
      # declarada vacía en `.env` (las de Stripe) tapa la de `.env.local` y el
      # servicio arranca sin credenciales.
      - path: .env.local
        required: false
    environment:
      - KEYCLOAK_URL=http://keycloak:8080

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - php

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: goveo-db
    environment:
      POSTGRES_USER: goveo
      POSTGRES_PASSWORD: goveo_pass
      POSTGRES_DB: goveo
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "goveo", "-U", "goveo"]
      timeout: 5s
      retries: 5
      start_period: 60s

  keycloak-db:
    image: postgres:16-alpine
    container_name: goveo-keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_pass
      POSTGRES_DB: keycloak
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  keycloak:
    build:
      context: ./docker/keycloak
      dockerfile: Dockerfile
    container_name: goveo-keycloak
    # La imagen arranca en modo producción por defecto; en local queremos el
    # modo dev, que no exige hostname ni TLS.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      # También como variable: al construir queda persistida en la imagen, pero
      # `start-dev` re-genera la configuración y la pierde. Declararla aquí hace
      # que valga en los dos modos.
      KC_FEATURES: token-exchange,admin-fine-grained-authz
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_pass
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      GOOGLE_SOCIAL_CLIENT_ID: ${GOOGLE_SOCIAL_CLIENT_ID:-}
      GOOGLE_SOCIAL_CLIENT_SECRET: ${GOOGLE_SOCIAL_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_PRIVATE_KEY_B64: ${APPLE_PRIVATE_KEY_B64:-}
    ports:
      - "8081:8080"
    depends_on:
      - keycloak-db
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import

  adminer:
    image: adminer:latest
    container_name: goveo-adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit:latest
    container_name: goveo-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db_data:
  keycloak_db_data:
