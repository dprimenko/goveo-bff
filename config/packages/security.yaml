security:
    providers:
        keycloak_users:
            id: App\Security\KeycloakUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            stateless: true
            provider: keycloak_users
            custom_authenticators:
                - App\Security\KeycloakAuthenticator

    access_control:
        # Public endpoints
        - { path: ^/api/v1/categories$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/v1/categories/, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/v1/geostories$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/v1/geostories/, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/v1/webhooks, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        - { path: ^/health, roles: PUBLIC_ACCESS }
        # Everything else requires auth
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
