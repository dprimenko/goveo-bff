# `X-Goveo-Supports` era la cabecera con la que un cliente decía qué sabía
# pintar (`image`). El BFF ya no la mira —las fotos van a todos—, pero la web la
# sigue mandando desde el navegador, y una cabecera propia fuerza la comprobación
# previa de CORS: quitarla de aquí cortaría esas peticiones y el feed de la web
# saldría vacío. Se puede quitar cuando ningún cliente la mande.
nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'X-Requested-With', 'X-Goveo-Supports']
        expose_headers: ['Link']
        allow_credentials: true
        max_age: 3600
    paths:
        '^/api':
            origin_regex: true
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
            allow_headers: ['Content-Type', 'Authorization', 'X-Requested-With', 'X-Goveo-Supports']
            allow_credentials: true
            max_age: 3600
