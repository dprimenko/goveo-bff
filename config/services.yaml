parameters:
    # Valor por defecto de las variables de entorno **opcionales**. Sin esto,
    # un entorno que no las declare no arranca: `%env(...)%` sin valor revienta
    # al construir el servicio que lo pide, y la API responde 500 en todo lo que
    # dependa de él — pasó al desplegar la caducidad de geostories, que dejó los
    # feeds de vídeo caídos hasta que se añadió la variable.
    #
    # Apagada por defecto: encenderla es una decisión, y un despliegue nuevo no
    # debería empezar a esconder contenido por su cuenta.
    env(GEOSTORY_EXPIRY_ENABLED): '0'

    # Audiencias aceptadas al verificar un token social, separadas por comas.
    # Vacías a propósito: sin lista, valen los clientes del mismo proyecto que
    # `GOOGLE_SOCIAL_CLIENT_ID` / `APPLE_CLIENT_ID`, que es lo que la app usa en
    # iOS, en Android y en la web. Se rellenan sólo para apretar el cerco.
    env(GOOGLE_ALLOWED_AUDIENCES): ''
    env(APPLE_ALLOWED_AUDIENCES): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # PostGIS event subscribers
    Jsor\Doctrine\PostGIS\Event\ORMSchemaEventSubscriber:
        tags:
            - { name: doctrine.event_subscriber }

    Jsor\Doctrine\PostGIS\Event\DBALSchemaEventSubscriber:
        tags:
            - { name: doctrine.event_subscriber }

    # Keycloak parameters
    App\Security\KeycloakAuthenticator:
        arguments:
            $keycloakUrl: '%env(KEYCLOAK_URL)%'
            $keycloakRealm: '%env(KEYCLOAK_REALM)%'
            $keycloakClientId: '%env(KEYCLOAK_CLIENT_ID)%'

    App\Auth\Infrastructure\Service\KeycloakService:
        arguments:
            $keycloakUrl: '%env(KEYCLOAK_URL)%'
            $keycloakRealm: '%env(KEYCLOAK_REALM)%'
            $keycloakClientId: '%env(KEYCLOAK_CLIENT_ID)%'
            $keycloakClientSecret: '%env(KEYCLOAK_CLIENT_SECRET)%'
            $keycloakAdminUser: '%env(KEYCLOAK_ADMIN_USER)%'
            $keycloakAdminPassword: '%env(KEYCLOAK_ADMIN_PASSWORD)%'

    # Verificación propia de los tokens sociales. Se usa para vincular cuentas
    # antiguas con su proveedor (ver SocialLoginController); la audiencia es lo
    # que impide que valga el token que otra aplicación obtuvo de sus usuarios.
    App\Auth\Infrastructure\Service\SocialTokenVerifier:
        arguments:
            $googleClientId: '%env(GOOGLE_SOCIAL_CLIENT_ID)%'
            $googleAllowedAudiences: '%env(GOOGLE_ALLOWED_AUDIENCES)%'
            $appleClientId: '%env(APPLE_CLIENT_ID)%'
            $appleAllowedAudiences: '%env(APPLE_ALLOWED_AUDIENCES)%'

    # Firebase / Firestore — data migration commands
    App\Shared\Infrastructure\Firebase\FirestoreClientFactory:
        arguments:
            $credentialsPath: '%env(FIREBASE_CREDENTIALS)%'
            $projectId: '%env(FIREBASE_PROJECT_ID)%'

    # Supabase — data migration source connection
    App\Shared\Infrastructure\Migration\SupabaseConnectionFactory:
        arguments:
            $databaseUrl: '%env(SUPABASE_DATABASE_URL)%'

    # Caducidad de eventos y noticias. Interruptor de entorno para poder
    # apagarla sin publicar app: la regla vive en el BFF (ver findFeed).
    App\GeoStories\Infrastructure\Repository\DoctrineGeoStoryRepository:
        arguments:
            $expiryEnabled: '%env(bool:GEOSTORY_EXPIRY_ENABLED)%'

    # Bunny Stream — video upload/transcoding
    App\GeoStories\Infrastructure\Service\BunnyVideoService:
        arguments:
            $bunnyApiKey: '%env(BUNNY_API_KEY)%'
            $bunnyLibraryId: '%env(BUNNY_LIBRARY_ID)%'
            $bunnyCdnHostname: '%env(BUNNY_CDN_HOSTNAME_VIDEOS)%'

    App\GeoStories\Infrastructure\Controller\BunnyWebhookController:
        arguments:
            $webhookSecret: '%env(BUNNY_WEBHOOK_SECRET)%'
        tags: ['controller.service_arguments']

    # Billing — VAT applied to subscriptions (was hardcoded as 21.0 in the legacy backend)
    App\Billing\Application\PriceCalculator:
        arguments:
            $taxPercent: '%env(int:BILLING_TAX_PERCENT)%'

    # Stripe — suscripciones de negocio
    App\Billing\Infrastructure\Stripe\StripeClientFactory:
        arguments:
            $secretKey: '%env(STRIPE_SECRET_KEY)%'

    App\Billing\Infrastructure\Controller\StripeWebhookController:
        arguments:
            $webhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'
        tags: ['controller.service_arguments']

    # Correo de bienvenida del alta de negocio
    App\Account\Application\WelcomeMailer:
        arguments:
            $fromAddress: '%env(EMAIL_FROM)%'
            $webUrl: '%env(WEB_URL)%'

    # Bunny Storage — imágenes de la ficha de negocio (distinto del Stream de vídeo)
    App\Shared\Infrastructure\Storage\BunnyStorageService:
        arguments:
            $zone: '%env(BUNNY_STORAGE_ZONE)%'
            $password: '%env(BUNNY_STORAGE_PASSWORD)%'
            $host: '%env(BUNNY_STORAGE_HOST)%'
            $cdnHostname: '%env(BUNNY_STORAGE_CDN_HOSTNAME)%'
